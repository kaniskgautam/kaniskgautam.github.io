<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background rounded tile -->
    <radialGradient id="vyaraBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fffefb"/>
      <stop offset="100%" stop-color="#eeebe1"/>
    </radialGradient>
    
    <!-- Olive gradient -->
    <linearGradient id="vyaraOlive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a8557"/>
      <stop offset="100%" stop-color="#555e3a"/>
    </linearGradient>

    <!-- Deep ink gradient -->
    <linearGradient id="vyaraInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32352b"/>
      <stop offset="100%" stop-color="#1d1e17"/>
    </linearGradient>
  </defs>

  <!-- App icon / favicon background tile -->
  <rect width="512" height="512" rx="116" fill="url(#vyaraBg)"/>
  <rect width="512" height="512" rx="116" fill="none" stroke="#dedfd4" stroke-width="12"/>

  <!-- Scaled center glyph -->
  <g transform="translate(18, 12)">
    <!-- Left stem: Ink -->
    <path d="M 120 120 
             L 190 120 
             C 190 120, 238 260, 252 308 
             L 202 308 
             Z" 
          fill="url(#vyaraInk)" />

    <!-- Right stem: Olive -->
    <path d="M 226 308 
             C 246 244, 298 164, 376 120 
             L 376 180 
             C 318 214, 276 274, 252 352 
             L 226 352 
             Z" 
          fill="url(#vyaraOlive)" />

    <!-- Base anchor curve -->
    <path d="M 184 308 
             Q 252 390 278 352 
             Q 240 336 184 308 Z" 
          fill="#454d31" />

    <!-- Signature accent dot -->
    <circle cx="376" cy="330" r="24" fill="#687249"/>
  </g>
</svg>
